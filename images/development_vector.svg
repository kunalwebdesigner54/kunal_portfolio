<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="devGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#9B51E0"/>
    </linearGradient>
    <linearGradient id="bgDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="glowDev" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Banner Background -->
  <rect x="0" y="0" width="400" height="200" fill="url(#bgDev)"/>

  <!-- Background Grid Lines -->
  <path d="M 0 40 L 400 40 M 0 80 L 400 80 M 0 120 L 400 120 M 0 160 L 400 160 M 80 0 L 80 200 M 160 0 L 160 200 M 240 0 L 240 200 M 320 0 L 320 200" stroke="#00F2FE" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Code Window Header -->
  <g transform="translate(25, 25)">
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#0F172A" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1.5"/>
    <path d="M 0 10 C 0 4.47 4.47 0 10 0 L 210 0 C 215.53 0 220 4.47 220 10 L 220 28 L 0 28 Z" fill="#1E293B"/>
    <circle cx="16" cy="14" r="4" fill="#EF4444"/>
    <circle cx="28" cy="14" r="4" fill="#F59E0B"/>
    <circle cx="40" cy="14" r="4" fill="#10B981"/>
    <text x="110" y="18" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">app.jsx</text>

    <!-- Code Lines -->
    <rect x="16" y="44" width="80" height="7" rx="3.5" fill="#00F2FE" opacity="0.9"/>
    <rect x="16" y="58" width="130" height="7" rx="3.5" fill="#4FACFE" opacity="0.7"/>
    <rect x="32" y="72" width="100" height="7" rx="3.5" fill="#9B51E0" opacity="0.8"/>
    <rect x="32" y="86" width="70" height="7" rx="3.5" fill="#38BDF8" opacity="0.6"/>
    <rect x="16" y="100" width="150" height="7" rx="3.5" fill="#818CF8" opacity="0.8"/>
    <rect x="16" y="114" width="90" height="7" rx="3.5" fill="#F43F5E" opacity="0.7"/>
  </g>

  <!-- React Atom & Core Graphic (Right Side) -->
  <g transform="translate(315, 100)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#devGrad)" stroke-width="2" filter="url(#glowDev)" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="45" ry="16" fill="none" stroke="#00F2FE" stroke-width="2.5" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="45" ry="16" fill="none" stroke="#4FACFE" stroke-width="2.5" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="45" ry="16" fill="none" stroke="#9B51E0" stroke-width="2.5" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="10" fill="#00F2FE" filter="url(#glowDev)"/>
  </g>
</svg>
