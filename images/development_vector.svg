<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="devGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#4FACFE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9B51E0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bgDev" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>
    <filter id="glowDev" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card Screen -->
  <rect x="20" y="20" width="360" height="160" rx="16" fill="url(#bgDev)" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Code Window Header -->
  <path d="M 20 36 C 20 27.16 27.16 20 36 20 L 364 20 C 372.84 20 380 27.16 380 36 L 380 48 L 20 48 Z" fill="#1E293B"/>
  <circle cx="42" cy="34" r="5" fill="#EF4444"/>
  <circle cx="58" cy="34" r="5" fill="#F59E0B"/>
  <circle cx="74" cy="34" r="5" fill="#10B981"/>
  <text x="200" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">mern_stack_app.js</text>

  <!-- Code Graphic Elements -->
  <!-- Left Code Lines -->
  <rect x="40" y="66" width="90" height="8" rx="4" fill="#00F2FE" opacity="0.8"/>
  <rect x="40" y="82" width="140" height="8" rx="4" fill="#4FACFE" opacity="0.6"/>
  <rect x="60" y="98" width="100" height="8" rx="4" fill="#9B51E0" opacity="0.7"/>
  <rect x="60" y="114" width="70" height="8" rx="4" fill="#38BDF8" opacity="0.5"/>
  <rect x="40" y="130" width="120" height="8" rx="4" fill="#818CF8" opacity="0.7"/>

  <!-- Right Side Vector Graphic: React Atom & Server Node -->
  <g transform="translate(280, 110)">
    <!-- Outer Glow Orbit -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#devGrad)" stroke-width="2" filter="url(#glowDev)" opacity="0.8"/>
    <!-- React Orbits -->
    <ellipse cx="0" cy="0" rx="36" ry="14" fill="none" stroke="#00F2FE" stroke-width="2.5" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="36" ry="14" fill="none" stroke="#4FACFE" stroke-width="2.5" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="36" ry="14" fill="none" stroke="#9B51E0" stroke-width="2.5" transform="rotate(120)"/>
    <!-- Core Nucleus -->
    <circle cx="0" cy="0" r="8" fill="#00F2FE" filter="url(#glowDev)"/>
  </g>

  <!-- Brackets & Floating Nodes -->
  <text x="195" y="125" font-family="monospace" font-weight="bold" font-size="36" fill="url(#devGrad)" opacity="0.9">{ }</text>
</svg>
