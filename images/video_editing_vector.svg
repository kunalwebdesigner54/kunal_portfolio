<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="videoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="bgVideo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="50%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#0F0F17"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Banner Background -->
  <rect x="0" y="0" width="400" height="200" fill="url(#bgVideo)"/>

  <!-- Subtle Grid -->
  <path d="M 0 40 L 400 40 M 0 80 L 400 80 M 0 120 L 400 120 M 0 160 L 400 160 M 80 0 L 80 200 M 160 0 L 160 200 M 240 0 L 240 200 M 320 0 L 320 200" stroke="#8B5CF6" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Premiere/DaVinci Video Monitor -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="220" height="100" rx="8" fill="#0F0F17" stroke="#3730A3" stroke-width="1.5"/>
    <circle cx="110" cy="50" r="24" fill="url(#videoGrad)" opacity="0.95"/>
    <polygon points="104,40 122,50 104,60" fill="#FFFFFF"/>
  </g>

  <!-- Audio Waveform Visual -->
  <g transform="translate(250, 20)">
    <rect x="0" y="0" width="130" height="100" rx="8" fill="#1E1E2E"/>
    <rect x="15" y="40" width="7" height="24" rx="3.5" fill="#EC4899"/>
    <rect x="30" y="25" width="7" height="50" rx="3.5" fill="#8B5CF6"/>
    <rect x="45" y="15" width="7" height="70" rx="3.5" fill="#3B82F6"/>
    <rect x="60" y="32" width="7" height="36" rx="3.5" fill="#6366F1"/>
    <rect x="75" y="20" width="7" height="60" rx="3.5" fill="#8B5CF6"/>
    <rect x="90" y="30" width="7" height="40" rx="3.5" fill="#EC4899"/>
    <rect x="105" y="42" width="7" height="16" rx="3.5" fill="#3B82F6"/>
  </g>

  <!-- Timeline Track Bar -->
  <g transform="translate(20, 130)">
    <rect x="0" y="0" width="360" height="50" rx="8" fill="#11111B" stroke="#312E81" stroke-width="1.5"/>
    <rect x="10" y="8" width="120" height="14" rx="4" fill="url(#videoGrad)"/>
    <rect x="136" y="8" width="145" height="14" rx="4" fill="#6366F1"/>
    <rect x="10" y="26" width="200" height="14" rx="4" fill="#06B6D4"/>
    <rect x="216" y="26" width="134" height="14" rx="4" fill="#EC4899" opacity="0.85"/>

    <!-- Playhead Red Line -->
    <line x1="160" y1="-5" x2="160" y2="45" stroke="#EF4444" stroke-width="2.5"/>
    <polygon points="154,-5 166,-5 160,2" fill="#EF4444"/>
  </g>
</svg>
