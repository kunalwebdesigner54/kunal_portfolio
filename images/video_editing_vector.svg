<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="videoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="bgVideo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="360" height="160" rx="16" fill="url(#bgVideo)" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Premiere/DaVinci Player Window -->
  <rect x="36" y="34" width="200" height="85" rx="8" fill="#0F0F17" stroke="#3730A3" stroke-width="1.5"/>
  <!-- Play Icon in Video Monitor -->
  <circle cx="136" cy="76.5" r="22" fill="url(#videoGrad)" opacity="0.9"/>
  <polygon points="130,68 147,76.5 130,85" fill="#FFFFFF"/>

  <!-- Audio Waveform Visual (Right Panel) -->
  <g transform="translate(248, 34)">
    <rect x="0" y="0" width="116" height="85" rx="8" fill="#1E1E2E"/>
    <rect x="12" y="32" width="6" height="22" rx="3" fill="#EC4899"/>
    <rect x="24" y="20" width="6" height="46" rx="3" fill="#8B5CF6"/>
    <rect x="36" y="12" width="6" height="60" rx="3" fill="#3B82F6"/>
    <rect x="48" y="28" width="6" height="30" rx="3" fill="#6366F1"/>
    <rect x="60" y="16" width="6" height="52" rx="3" fill="#8B5CF6"/>
    <rect x="72" y="24" width="6" height="38" rx="3" fill="#EC4899"/>
    <rect x="84" y="36" width="6" height="14" rx="3" fill="#3B82F6"/>
  </g>

  <!-- Timeline Track Bar (Bottom) -->
  <rect x="36" y="126" width="328" height="38" rx="8" fill="#11111B" stroke="#312E81" stroke-width="1.5"/>
  <!-- Video Track 1 (Violet) -->
  <rect x="44" y="132" width="110" height="11" rx="4" fill="url(#videoGrad)"/>
  <rect x="160" y="132" width="130" height="11" rx="4" fill="#6366F1"/>
  <!-- Audio Track 2 (Cyan/Pink) -->
  <rect x="44" y="147" width="180" height="11" rx="4" fill="#06B6D4"/>
  <rect x="230" y="147" width="124" height="11" rx="4" fill="#EC4899" opacity="0.8"/>

  <!-- Playhead Red Needle -->
  <line x1="180" y1="120" x2="180" y2="164" stroke="#EF4444" stroke-width="2"/>
  <polygon points="175,120 185,120 180,126" fill="#EF4444"/>
</svg>
