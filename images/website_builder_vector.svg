<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="builderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21759B"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="bgBuilder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="20" y="20" width="360" height="160" rx="16" fill="url(#bgBuilder)" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Builder Sidebar (Elementor/Webflow style) -->
  <rect x="36" y="36" width="90" height="128" rx="8" fill="#1C2541"/>
  <rect x="46" y="46" width="70" height="10" rx="3" fill="#3A506B"/>
  <!-- Drag Blocks -->
  <rect x="46" y="64" width="32" height="28" rx="4" fill="url(#builderGrad)"/>
  <rect x="84" y="64" width="32" height="28" rx="4" fill="#3A506B"/>
  <rect x="46" y="98" width="32" height="28" rx="4" fill="#3A506B"/>
  <rect x="84" y="98" width="32" height="28" rx="4" fill="url(#builderGrad)" opacity="0.8"/>
  <rect x="46" y="132" width="70" height="20" rx="4" fill="#5BC0BE"/>

  <!-- Main Canvas Canvas Area -->
  <rect x="136" y="36" width="228" height="128" rx="8" fill="#0B132B" stroke="#3A506B" stroke-width="1.5"/>
  <!-- Canvas Header -->
  <rect x="146" y="46" width="208" height="32" rx="6" fill="url(#builderGrad)" opacity="0.9"/>
  <!-- Canvas Column Grid -->
  <rect x="146" y="86" width="98" height="68" rx="6" fill="#1C2541" stroke="#00F2FE" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="256" y="86" width="98" height="68" rx="6" fill="#1C2541" stroke="#4FACFE" stroke-width="1"/>

  <!-- W Icon Badge (WordPress / Webflow vibe) -->
  <g transform="translate(195, 120)">
    <circle cx="0" cy="0" r="16" fill="#21759B" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="6" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#FFFFFF" text-anchor="middle">W</text>
  </g>
</svg>
