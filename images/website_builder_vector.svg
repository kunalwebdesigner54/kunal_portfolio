<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="builderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21759B"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="bgBuilder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Banner Background -->
  <rect x="0" y="0" width="400" height="200" fill="url(#bgBuilder)"/>

  <!-- Subtle Grid -->
  <path d="M 0 40 L 400 40 M 0 80 L 400 80 M 0 120 L 400 120 M 0 160 L 400 160 M 80 0 L 80 200 M 160 0 L 160 200 M 240 0 L 240 200 M 320 0 L 320 200" stroke="#00F2FE" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Sidebar Drag & Drop Panel -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="110" height="160" rx="10" fill="#1C2541" stroke="#3A506B" stroke-width="1.5"/>
    <rect x="12" y="14" width="86" height="12" rx="3" fill="#3A506B"/>
    <rect x="12" y="36" width="40" height="34" rx="5" fill="url(#builderGrad)"/>
    <rect x="58" y="36" width="40" height="34" rx="5" fill="#3A506B"/>
    <rect x="12" y="78" width="40" height="34" rx="5" fill="#3A506B"/>
    <rect x="58" y="78" width="40" height="34" rx="5" fill="url(#builderGrad)" opacity="0.85"/>
    <rect x="12" y="120" width="86" height="26" rx="5" fill="#5BC0BE"/>
  </g>

  <!-- Main Canvas Canvas Area -->
  <g transform="translate(145, 20)">
    <rect x="0" y="0" width="235" height="160" rx="10" fill="#0B132B" stroke="#3A506B" stroke-width="1.5"/>
    <rect x="12" y="14" width="211" height="38" rx="6" fill="url(#builderGrad)" opacity="0.9"/>
    <rect x="12" y="60" width="100" height="86" rx="6" fill="#1C2541" stroke="#00F2FE" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="123" y="60" width="100" height="86" rx="6" fill="#1C2541" stroke="#4FACFE" stroke-width="1"/>

    <!-- W WordPress/Webflow Emblem -->
    <g transform="translate(62, 103)">
      <circle cx="0" cy="0" r="18" fill="#21759B" stroke="#FFFFFF" stroke-width="2"/>
      <text x="0" y="6" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#FFFFFF" text-anchor="middle">W</text>
    </g>
  </g>
</svg>
