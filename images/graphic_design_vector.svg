<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="graphicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#9B51E0"/>
    </linearGradient>
    <linearGradient id="bgGraphic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240A34"/>
      <stop offset="50%" stop-color="#1A0F2E"/>
      <stop offset="100%" stop-color="#0E051D"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Banner Background -->
  <rect x="0" y="0" width="400" height="200" fill="url(#bgGraphic)"/>

  <!-- Subtle Grid -->
  <path d="M 0 40 L 400 40 M 0 80 L 400 80 M 0 120 L 400 120 M 0 160 L 400 160 M 80 0 L 80 200 M 160 0 L 160 200 M 240 0 L 240 200 M 320 0 L 320 200" stroke="#FF4081" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Main Canvas Board -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="245" height="160" rx="10" fill="#130924" stroke="#5B21B6" stroke-width="1.5"/>
    <path d="M 20 120 C 70 30, 140 170, 225 70" fill="none" stroke="url(#graphicGrad)" stroke-width="5" stroke-linecap="round"/>
    <rect x="16" y="116" width="10" height="10" fill="#00F2FE" stroke="#FFF" stroke-width="1.5"/>
    <rect x="220" y="65" width="10" height="10" fill="#00F2FE" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="85" cy="65" r="6" fill="#FF4081"/>
    <circle cx="150" cy="125" r="6" fill="#F59E0B"/>
    <line x1="85" y1="65" x2="20" y2="120" stroke="#94A3B8" stroke-dasharray="3,3"/>
    <line x1="150" y1="125" x2="225" y2="70" stroke="#94A3B8" stroke-dasharray="3,3"/>

    <!-- Pen Tool -->
    <g transform="translate(170, 30)">
      <polygon points="0,0 28,-14 42,0 0,42 -10,32" fill="url(#graphicGrad)"/>
      <circle cx="7" cy="12" r="3.5" fill="#FFF"/>
    </g>
  </g>

  <!-- Color Palette Swatches -->
  <g transform="translate(285, 20)">
    <rect x="0" y="0" width="90" height="160" rx="10" fill="#241442" stroke="#5B21B6" stroke-width="1.5"/>
    <circle cx="45" cy="30" r="16" fill="#FF4081"/>
    <circle cx="45" cy="70" r="16" fill="#F59E0B"/>
    <circle cx="45" cy="110" r="16" fill="#9B51E0"/>
    <circle cx="45" cy="142" r="8" fill="#00F2FE"/>
  </g>
</svg>
