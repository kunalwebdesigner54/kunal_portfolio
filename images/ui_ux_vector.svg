<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="50%" stop-color="#9B51E0"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <linearGradient id="bgUi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1035"/>
      <stop offset="50%" stop-color="#0F1420"/>
      <stop offset="100%" stop-color="#091E3A"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Banner Background -->
  <rect x="0" y="0" width="400" height="200" fill="url(#bgUi)"/>

  <!-- Subtle Background Grid -->
  <path d="M 0 40 L 400 40 M 0 80 L 400 80 M 0 120 L 400 120 M 0 160 L 400 160 M 80 0 L 80 200 M 160 0 L 160 200 M 240 0 L 240 200 M 320 0 L 320 200" stroke="#9B51E0" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Desktop Artboard -->
  <g transform="translate(25, 25)">
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5" opacity="0.95"/>
    <rect x="12" y="14" width="196" height="16" rx="4" fill="#312E81"/>
    <circle cx="22" cy="22" r="3.5" fill="#FF4081"/>
    <circle cx="34" cy="22" r="3.5" fill="#F59E0B"/>
    <circle cx="46" cy="22" r="3.5" fill="#10B981"/>
    <!-- UI Card Layout -->
    <rect x="12" y="38" width="90" height="52" rx="6" fill="url(#uiGrad)" opacity="0.85"/>
    <rect x="110" y="38" width="98" height="22" rx="4" fill="#4338CA"/>
    <rect x="110" y="68" width="70" height="22" rx="4" fill="#6366F1" opacity="0.7"/>
    <rect x="12" y="98" width="196" height="38" rx="6" fill="#312E81"/>
  </g>

  <!-- Mobile Screen Overlay -->
  <g transform="translate(265, 20)">
    <rect x="0" y="0" width="110" height="160" rx="16" fill="#090D16" stroke="url(#uiGrad)" stroke-width="2.5"/>
    <rect x="40" y="8" width="30" height="4" rx="2" fill="#334155"/>
    <rect x="12" y="22" width="86" height="42" rx="8" fill="url(#uiGrad)"/>
    <rect x="12" y="72" width="86" height="14" rx="4" fill="#1E293B"/>
    <rect x="12" y="94" width="55" height="12" rx="4" fill="#334155"/>
    <rect x="12" y="114" width="86" height="32" rx="6" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
  </g>

  <!-- Vector Cursor -->
  <g transform="translate(225, 115)">
    <polygon points="0,0 0,26 7,20 14,33 20,30 13,16 21,16" fill="#00F2FE" stroke="#000" stroke-width="1.5"/>
  </g>
</svg>
